<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Herr Kastners Lernseite</title>
<style>
  :root {
    --page-bg: #f6f0e4;
    --page-text: #2b2f36;
    --card: #1b232d;
    --card-text: #f1f3f6;
    --card-muted: #a5afbb;
    --card-line: #2e3844;
    --accent: #6ea0ff;
    --accent-text: #0e1624;
    --green: #1f9d55;
    --red: #d93636;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page-bg);
    color: var(--page-text);
    font-family: "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .view { display: none; min-height: 100%; padding: 32px 24px; }
  .view.active { display: block; }

  /* ---------- Startseite ---------- */
  .page { max-width: 960px; margin: 0 auto; }
  h1 {
    font-size: clamp(2rem, 6vw, 3.6rem);
    line-height: 1.1;
    margin: 8px 0 56px;
    font-weight: 800;
    text-align: center;
    letter-spacing: -0.01em;
  }
  .section-title {
    display: flex; align-items: center; gap: 14px;
    font-size: clamp(1.6rem, 4.5vw, 2.2rem);
    font-weight: 800;
    margin: 0 0 24px;
    text-align: left;
  }
  .section-title svg { width: 40px; height: 40px; flex: 0 0 auto; color: #1b3a6b; }

  .track {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start;
    gap: 24px 32px;
    padding: 20px;
    background: var(--card);
    color: var(--card-text);
    border-radius: 24px;
  }
  .track-img { width: min(100%, 340px); height: auto; flex: 0 0 auto; border-radius: 16px; display: block; }
  .track-body { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 20px 28px; flex: 1 1 280px; min-width: 0; }
  .track-title { margin: 0; font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800; }

  .btn {
    font: inherit;
    font-size: 1.3rem;
    font-weight: 700;
    min-height: 56px;
    padding: 14px 32px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible, .home:focus-visible, .spot:focus-visible { outline: 3px solid #ffd23f; outline-offset: 3px; }
  .btn.ghost { background: transparent; color: var(--card-text); border: 2px solid var(--card-muted); }

  /* ---------- Lesespur ---------- */
  .story-page { max-width: 1240px; margin: 0 auto; padding-top: 64px; }
  .story-card {
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px;
    padding: 20px;
    background: var(--card);
    color: var(--card-text);
    border-radius: 24px;
  }
  @media (min-width: 1200px) {
    .story-card { grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); }
  }
  .scene { position: relative; align-self: start; }
  .scene img { width: 100%; height: auto; display: block; border-radius: 16px; }

  .spot {
    position: absolute;
    transform: translate(-50%, -50%);
    width: clamp(44px, 5.6vw, 64px);
    height: clamp(44px, 5.6vw, 64px);
    border-radius: 50%;
    border: 3px solid var(--card);
    background: #ffffff;
    color: var(--card);
    font: inherit;
    font-size: clamp(1.2rem, 2.4vw, 1.7rem);
    font-weight: 800;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .45);
    transition: background-color .2s, color .2s;
  }
  .spot.done { background: var(--green); color: #fff; border-color: #fff; }
  .spot.wrong { background: var(--red); color: #fff; border-color: #fff; }

  .chapter-panel { align-self: start; }
  .chapter-panel h2 { font-size: clamp(1.6rem, 3.6vw, 2.2rem); line-height: 1.15; font-weight: 800; margin: 0 0 20px; text-align: left; }
  .chapter p { font-size: clamp(1.15rem, 2.4vw, 1.45rem); line-height: 1.65; margin: 0 0 16px; max-width: 46ch; text-align: left; }
  .chapter p.note { border-left: 5px solid var(--accent); padding-left: 16px; font-style: italic; }
  .chapter p.question { font-weight: 800; margin-top: 24px; }
  .chapter p.end { font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 800; margin-top: 24px; }
  .tip { color: var(--card-muted); font-size: 1.05rem; margin: 0 0 16px; }
  .hint {
    display: inline-block;
    background: #7f1d1d; color: #fff;
    border-left: 6px solid #ff6b6b;
    border-radius: 10px;
    font-size: 1.4rem; font-weight: 800;
    padding: 10px 18px; margin: 0 0 16px;
  }
  .hint[hidden], .actions[hidden] { display: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }

  .home {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: 16px;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 2px solid var(--card-line);
    background: var(--card);
    color: var(--card-text);
    cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
    padding: 0;
    z-index: 5;
  }
  .home svg { width: 28px; height: 28px; }
  body.on-story .home { display: flex; }
  .track + .track { margin-top: 24px; }
  .story-heading { color: var(--card-muted); font-size: 1.1rem; font-weight: 700; margin: 0 0 8px; text-align: left; }
  .story-heading:empty { display: none; }
  .btn[hidden] { display: none; }
</style>
</head>
<body>

<button class="home" id="homeBtn" aria-label="Zur Startseite" title="Zur Startseite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 11.5 12 4l9 7.5"/>
    <path d="M5.5 10v9.5h13V10"/>
    <path d="M10 19.5v-5h4v5"/>
  </svg>
</button>

<main>
  <section class="view active" id="start">
    <div class="page">
      <h1>Herr Kastners Lernseite</h1>

      <h2 class="section-title">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M24 12c-4-3-10-4-17-3v27c7-1 13 0 17 3 4-3 10-4 17-3V9c-7-1-13 0-17 3Z"/>
          <path d="M24 12v27"/>
          <path d="M12 17c3 0 5 .3 8 1.5M12 24c3 0 5 .3 8 1.5M36 17c-3 0-5 .3-8 1.5M36 24c-3 0-5 .3-8 1.5"/>
        </svg>
        Lesespuren
      </h2>

      <article class="track">
        <img class="track-img" data-thumb="1" alt="Gemalte Weihnachtsstube mit Kamin, Tannenbaum, Geschenken und einer Familie">
        <div class="track-body">
          <h3 class="track-title">Weihnachten</h3>
          <button class="btn" id="goStory">Zur Lesespur</button>
        </div>
      </article>

      <article class="track">
        <img class="track-img" data-thumb="2" alt="Gemaltes Klassenzimmer mit Adventskalender, Kindern beim Basteln von Sternen und einer Lehrerin">
        <div class="track-body">
          <h3 class="track-title">Advent an der Zwieseltal-Grundschule</h3>
          <button class="btn" id="goAdvent">Zur Lesespur</button>
        </div>
      </article>
    </div>
  </section>

  <section class="view" id="story"></section>
  <section class="view" id="advent"></section>
</main>

    root.innerHTML =
      '<div class="story-page"><div class="story-card">' +
      '<div class="scene"><img></div>' +
      '<div class="chapter-panel" aria-live="polite">' +

      '<button class="btn ghost tostart">Zur Startseite</button></div>' +
      '</div></div></div>';

    var scene = root.querySelector('.scene');
    var img = scene.querySelector('img');
    img.src = cfg.img; img.alt = cfg.alt;
    root.querySelector('.story-heading').textContent = cfg.heading || '';
    var titleEl = root.querySelector('h2');
    var textEl = root.querySelector('.chapter');
    var hintEl = root.querySelector('.hint');
    var actionsEl = root.querySelector('.actions');

    var step = 0, done = {}, wrongN = null, spotEls = {};

    cfg.spots.forEach(function (s) {
      var b = document.createElement('button');
      b.className = 'spot';
      b.textContent = s.n;
      b.style.left = s.x + '%';
      b.style.top = s.y + '%';
      b.setAttribute('aria-label', 'Kapitel ' + s.n);
      b.addEventListener('click', function () { pick(s.n); });
      scene.appendChild(b);
      spotEls[s.n] = b;
    });

    function addP(text, cls) {
      var p = document.createElement('p');
      if (cls) p.className = cls;
      p.textContent = text;
      textEl.appendChild(p);
    }
    function paint() {
      cfg.spots.forEach(function (s) {
        spotEls[s.n].classList.toggle('done', !!done[s.n]);
        spotEls[s.n].classList.toggle('wrong', wrongN === s.n);
      });
    }
    function render() {
      var c = cfg.chapters[cfg.order[step]];
      var isEnd = step === cfg.order.length - 1;
      titleEl.textContent = c.title;
      textEl.innerHTML = '';
      c.text.forEach(function (line) {
        if (line.charAt(0) === '~') addP(line.slice(1), 'note'); else addP(line);
      });
      if (c.question) addP(c.question, 'question');
      if (!isEnd) addP('Tippe im Bild auf den richtigen Ort.', 'tip');
      if (c.end) addP(c.end, 'end');
      actionsEl.hidden = !isEnd;
      hintEl.hidden = true;
      paint();
    }
    function pick(n) {
      if (step === cfg.order.length - 1) return;       // Geschichte ist zu Ende
      wrongN = null; hintEl.hidden = true;
      if (n === cfg.order[step + 1]) { step++; done[n] = true; render(); }   // richtig
      else if (done[n]) { paint(); }                                          // schon gelesen
      else { wrongN = n; hintEl.hidden = false; paint(); }                    // falsch
    }
    function reset() {
      step = 0; done = {}; done[cfg.order[0]] = true; wrongN = null;
      render();
    }

    root.querySelector('.restart').addEventListener('click', function () { reset(); window.scrollTo(0, 0); });
    root.querySelector('.tostart').addEventListener('click', function () { show('start'); });
    return { reset: reset };
  }

  var trails = {
    story: createTrail({
      id: 'story', img: IMG1, heading: 'Weihnachten',
      alt: 'Gemalte Weihnachtsstube mit Kamin, Tannenbaum, Geschenken und einer Familie',
      chapters: WEIHNACHTEN,
      order: [1, 2, 4, 7],
      spots: [
        { n: 1, x: 55.3, y: 76.9 },
        { n: 2, x: 14.4, y: 69.7 },
        { n: 3, x: 87.6, y: 25.8 },
        { n: 4, x: 47.4, y: 36.1 },
        { n: 5, x: 74.5, y: 86.5 },
        { n: 6, x: 51.0, y: 55.0 },
        { n: 7, x: 32.3, y: 15.0 }
      ]
    }),
    advent: createTrail({
      id: 'advent', img: IMG2, heading: 'Advent an der Zwieseltal-Grundschule',
      alt: 'Gemaltes Klassenzimmer mit Adventskalender, Kindern beim Basteln von Sternen und einer Lehrerin',
      chapters: ADVENT,
      order: [1, 5, 3, 6, 7],
      spots: [
        { n: 1, x: 16.7, y: 12.4 },
        { n: 2, x: 11.7, y: 67.7 },
        { n: 3, x: 3.9,  y: 76.2 },
        { n: 4, x: 49.7, y: 37.8 },
        { n: 5, x: 56.3, y: 70.3 },
        { n: 6, x: 82.4, y: 43.0 },
        { n: 7, x: 45.1, y: 81.4 }
      ]
    })
  };

  // ================= Seitenwechsel =================
  var views = { start: document.getElementById('start'), story: document.getElementById('story'), advent: document.getElementById('advent') };
  var HASHES = { story: '#lesespur', advent: '#advent' };

  function show(name) {
    if (trails[name]) trails[name].reset();
    for (var key in views) views[key].classList.toggle('active', key === name);
    document.body.classList.toggle('on-story', name !== 'start');
    window.scrollTo(0, 0);
    try { window.history.replaceState(null, '', HASHES[name] || location.pathname); } catch (e) {}
  }
  function pageFromHash() {
    return location.hash === '#lesespur' ? 'story' : location.hash === '#advent' ? 'advent' : 'start';
  }

  document.getElementById('goStory').addEventListener('click', function () { show('story'); });
  document.getElementById('goAdvent').addEventListener('click', function () { show('advent'); });
  document.getElementById('homeBtn').addEventListener('click', function () { show('start'); });
  window.addEventListener('hashchange', function () { show(pageFromHash()); });
  if (pageFromHash() !== 'start') show(pageFromHash());
</script>
</body>
</html>
