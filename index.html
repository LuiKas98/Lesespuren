<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Herr Kastners Lernseite</title>
<style>
  :root {
    --page-bg: #f6f0e4;
    --page-text: #2b2f36;
    --card: #1b232d;
    --card-text: #f1f3f6;
    --card-muted: #a5afbb;
    --card-line: #2e3844;
    --accent: #6ea0ff;
    --accent-text: #0e1624;
    --green: #1f9d55;
    --red: #d93636;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page-bg);
    color: var(--page-text);
    font-family: "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .view { display: none; min-height: 100%; padding: 32px 24px; }
  .view.active { display: block; }

  /* ---------- Startseite ---------- */
  .page { max-width: 960px; margin: 0 auto; }
  h1 {
    font-size: clamp(2rem, 6vw, 3.6rem);
    line-height: 1.1;
    margin: 8px 0 56px;
    font-weight: 800;
    text-align: center;
    letter-spacing: -0.01em;
  }
  .section-title {
    display: flex; align-items: center; gap: 14px;
    font-size: clamp(1.6rem, 4.5vw, 2.2rem);
    font-weight: 800;
    margin: 0 0 24px;
    text-align: left;
  }
  .section-title svg { width: 40px; height: 40px; flex: 0 0 auto; color: #1b3a6b; }

  .track {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start;
    gap: 24px 32px;
    padding: 20px;
    background: var(--card);
    color: var(--card-text);
    border-radius: 24px;
  }
  .track-img { width: min(100%, 340px); height: auto; flex: 0 0 auto; border-radius: 16px; display: block; }
  .track-body { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 20px 28px; flex: 1 1 280px; min-width: 0; }
  .track-title { margin: 0; font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800; flex: 0 1 auto; max-width: 100%; }

  .btn {
    font: inherit;
    font-size: 1.3rem;
    font-weight: 700;
    min-height: 56px;
    padding: 14px 32px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible, .home:focus-visible, .spot:focus-visible { outline: 3px solid #ffd23f; outline-offset: 3px; }
  .btn.ghost { background: transparent; color: var(--card-text); border: 2px solid var(--card-muted); }

  /* ---------- Lesespur ---------- */
  .story-page { max-width: 1240px; margin: 0 auto; padding-top: 64px; }
  .story-card {
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px;
    padding: 20px;
    background: var(--card);
    color: var(--card-text);
    border-radius: 24px;
  }
  @media (min-width: 1200px) {
    .story-card { grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); }
  }
  .scene { position: relative; align-self: start; }
  .scene img { width: 100%; height: auto; display: block; border-radius: 16px; }

  .spot {
    position: absolute;
    transform: translate(-50%, -50%);
    width: clamp(44px, 5.6vw, 64px);
    height: clamp(44px, 5.6vw, 64px);
    border-radius: 50%;
    border: 3px solid var(--card);
    background: #ffffff;
    color: var(--card);
    font: inherit;
    font-size: clamp(1.2rem, 2.4vw, 1.7rem);
    font-weight: 800;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .45);
    transition: background-color .2s, color .2s;
  }
  .spot.done { background: var(--green); color: #fff; border-color: #fff; }
  .spot.wrong { background: var(--red); color: #fff; border-color: #fff; }

  .chapter-panel { align-self: start; }
  .chapter-panel h2 { font-size: clamp(1.6rem, 3.6vw, 2.2rem); line-height: 1.15; font-weight: 800; margin: 0 0 20px; text-align: left; }
  .chapter p { font-size: clamp(1.15rem, 2.4vw, 1.45rem); line-height: 1.65; margin: 0 0 16px; max-width: 46ch; text-align: left; }
  .chapter p.note { border-left: 5px solid var(--accent); padding-left: 16px; font-style: italic; }
  .chapter p.question { font-weight: 800; margin-top: 24px; }
  .chapter p.end { font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 800; margin-top: 24px; }
  .tip { color: var(--card-muted); font-size: 1.05rem; margin: 0 0 16px; }
  .hint {
    display: inline-block;
    background: #7f1d1d; color: #fff;
    border-left: 6px solid #ff6b6b;
    border-radius: 10px;
    font-size: 1.4rem; font-weight: 800;
    padding: 10px 18px; margin: 0 0 16px;
  }
  .hint[hidden], .actions[hidden] { display: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }

  .track + .track { margin-top: 24px; }
  .story-page.narrow { max-width: 860px; }
  .story-card.single { grid-template-columns: minmax(0, 1fr); }
  .story-heading { color: var(--card-muted); font-size: 1.1rem; font-weight: 700; margin: 0 0 8px; text-align: left; }
  .choices { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; margin-top: 8px; }
  .choices .btn { text-align: left; font-size: 1.2rem; line-height: 1.3; border-radius: 20px; }
  .back-row { margin-top: 32px; }
  .back-row[hidden], .btn[hidden] { display: none; }

  .home {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: 16px;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 2px solid var(--card-line);
    background: var(--card);
    color: var(--card-text);
    cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
    padding: 0;
    z-index: 5;
  }
  .home svg { width: 28px; height: 28px; }
  body.on-story .home { display: flex; }
</style>
</head>
<body>

<button class="home" id="homeBtn" aria-label="Zur Startseite" title="Zur Startseite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 11.5 12 4l9 7.5"/>
    <path d="M5.5 10v9.5h13V10"/>
    <path d="M10 19.5v-5h4v5"/>
  </svg>
</button>

<main>
  <section class="view active" id="start">
    <div class="page">
      <h1>Herr Kastners Lernseite</h1>

      <h2 class="section-title">

        <div class="track-body">
          <h3 class="track-title">Advent an der Zwieseltal-Grundschule</h3>
          <button class="btn" id="goAdvent">Zur Lesespur</button>

    </div>
  </section>

  <section class="view" id="story">
    <div class="story-page">
      <div class="story-card">
        <div class="scene" id="scene">
          <img data-scene alt="Gemalte Weihnachtsstube mit Kamin, Tannenbaum, Geschenken und einer Familie">
        </div>
        <div class="chapter-panel" aria-live="polite">
          <h2 id="chapterTitle"></h2>
          <div class="chapter" id="chapterText"></div>
          <div class="hint" id="hint" role="alert" hidden>Lies genau</div>
          <div class="actions" id="actions" hidden>
            <button class="btn" id="restartBtn">Nochmal von vorn lesen</button>
            <button class="btn ghost" id="toStartBtn">Zur Startseite</button>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section class="view" id="advent">
    <div class="story-page narrow">
      <div class="story-card single">
        <div class="chapter-panel" aria-live="polite">
          <p class="story-heading">Advent an der Zwieseltal-Grundschule</p>
          <h2 id="advTitle"></h2>
          <div class="chapter" id="advText"></div>
          <div class="choices" id="advChoices"></div>
          <div class="back-row"><button class="btn ghost" id="advBack" hidden>Zurück</button></div>
        </div>
      </div>
    </div>
  </section>
</main>

  var step = 0;          // Position in ORDER
  var done = {};         // richtig angeklickte Buttons (bleiben grün)
  var wrongN = null;     // aktuell rot markierter Button

  var titleEl = document.getElementById('chapterTitle');
  var textEl = document.getElementById('chapterText');
  var hintEl = document.getElementById('hint');
  var actionsEl = document.getElementById('actions');
  var sceneEl = document.getElementById('scene');
  var spotEls = {};

  SPOTS.forEach(function (s) {
    var b = document.createElement('button');
    b.className = 'spot';
    b.textContent = s.n;
    b.style.left = s.x + '%';
    b.style.top = s.y + '%';
    b.setAttribute('aria-label', 'Kapitel ' + s.n);
    b.addEventListener('click', function () { pick(s.n); });
    sceneEl.appendChild(b);
    spotEls[s.n] = b;
  });

  function addP(text, cls) {
    var p = document.createElement('p');
    if (cls) p.className = cls;
    p.textContent = text;
    textEl.appendChild(p);
  }

  function paint() {
    SPOTS.forEach(function (s) {
      spotEls[s.n].classList.toggle('done', !!done[s.n]);
      spotEls[s.n].classList.toggle('wrong', wrongN === s.n);
    });
  }

  function renderChapter() {
    var c = chapters[ORDER[step]];
    var isEnd = step === ORDER.length - 1;
    titleEl.textContent = c.title;
    textEl.innerHTML = '';
    c.text.forEach(function (line) {
      if (line.charAt(0) === '~') addP(line.slice(1), 'note');
      else addP(line);
    });
    if (c.question) addP(c.question, 'question');
    if (!isEnd) addP('Tippe im Bild auf den richtigen Ort.', 'tip');
    if (c.end) addP(c.end, 'end');
    actionsEl.hidden = !isEnd;
    hintEl.hidden = true;
    paint();
  }

  function pick(n) {
    if (step === ORDER.length - 1) return;      // Geschichte ist zu Ende
    wrongN = null;
    hintEl.hidden = true;
    if (n === ORDER[step + 1]) {                // richtig
      step++;
      done[n] = true;
      renderChapter();
    } else if (done[n]) {                       // schon gelesen: nichts passiert
      paint();
    } else {                                    // falsch
      wrongN = n;
      hintEl.hidden = false;
      paint();
    }
  }

  function reset() {
    step = 0; done = { 1: true }; wrongN = null;
    renderChapter();
  }

  document.getElementById('restartBtn').addEventListener('click', function () { reset(); window.scrollTo(0, 0); });
  document.getElementById('toStartBtn').addEventListener('click', function () { show('start'); });

  // ---------- Advent an der Zwieseltal-Grundschule (Auswahl-Geschichte) ----------

        "Mia und Ben aus der zweiten Klasse freuen sich auf den Schultag. Heute soll die erste Kerze am Adventskranz angezündet werden.",

  var advVisited = [];
  var advCurrent = 1;
  var advTitleEl = document.getElementById('advTitle');
  var advTextEl = document.getElementById('advText');
  var advChoicesEl = document.getElementById('advChoices');
  var advBackBtn = document.getElementById('advBack');

  function advP(text, cls) {
    var p = document.createElement('p');
    if (cls) p.className = cls;
    p.textContent = text;
    advTextEl.appendChild(p);
  }

  function renderAdvent() {
    var c = advent[advCurrent];
    advTitleEl.textContent = c.title;
    advTextEl.innerHTML = '';
    advChoicesEl.innerHTML = '';
    c.text.forEach(function (line) {
      if (line.charAt(0) === '~') advP(line.slice(1), 'note');
      else advP(line);
    });
    if (c.question) advP(c.question, 'question');
    if (c.end) advP(c.end, 'end');
    c.choices.forEach(function (ch) {
      var b = document.createElement('button');
      b.className = 'btn';
      b.textContent = ch.label;
      b.addEventListener('click', function () {
        if (ch.home) { show('start'); return; }
        if (ch.restart) advVisited = []; else advVisited.push(advCurrent);
        advCurrent = ch.to;
        renderAdvent();
        window.scrollTo(0, 0);
      });
      advChoicesEl.appendChild(b);
    });
    advBackBtn.hidden = advVisited.length === 0;
  }

  advBackBtn.addEventListener('click', function () {
    if (advVisited.length) { advCurrent = advVisited.pop(); renderAdvent(); window.scrollTo(0, 0); }
  });

  function resetAdvent() { advVisited = []; advCurrent = 1; renderAdvent(); }

  // ---------- Seitenwechsel ----------
  var HASHES = { story: '#lesespur', advent: '#advent' };

  function show(name) {
    if (name === 'story') reset();
    if (name === 'advent') resetAdvent();
    for (var key in views) views[key].classList.toggle('active', key === name);
    document.body.classList.toggle('on-story', name !== 'start');
    window.scrollTo(0, 0);
    try { window.history.replaceState(null, '', HASHES[name] || location.pathname); } catch (e) {}
  }

  function pageFromHash() {
    return location.hash === '#lesespur' ? 'story' : location.hash === '#advent' ? 'advent' : 'start';
  }

  document.getElementById('goStory').addEventListener('click', function () { show('story'); });
  document.getElementById('goAdvent').addEventListener('click', function () { show('advent'); });
  document.getElementById('homeBtn').addEventListener('click', function () { show('start'); });
  window.addEventListener('hashchange', function () { show(pageFromHash()); });
  if (pageFromHash() !== 'start') show(pageFromHash());
</script>
